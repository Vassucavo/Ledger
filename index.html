<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4EAE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ledger</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --canvas:#E4EAE3; --paper:#F8FAF6; --ink:#18241E; --muted:#78877E;
  --line:#C9D3C6; --intake:#A87C15; --burn:#1D6B67; --warn:#8C4A2F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  background:var(--canvas); color:var(--ink);
  min-height:100vh; font-size:15px; line-height:1.4;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-user-select:none; user-select:none;
}
input,button,select{font-family:inherit;font-size:16px}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--burn);outline-offset:2px}

.wrap{max-width:480px;margin:0 auto;padding:20px 16px 130px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.date{font-size:17px;font-weight:600}
.chipbtn{background:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;
  font-size:13px;color:var(--muted);margin-left:6px}
.chipbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.big{font-size:44px;font-weight:600;line-height:1.05;margin-bottom:16px}
.bar-label{display:flex;justify-content:space-between;margin-bottom:4px}
.bar-track{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:12px}
.bar-fill{height:100%;border-radius:5px;transition:width .4s ease}

h2.sec{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.row .body{flex:1;min-width:0}
.row .name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11px;color:var(--muted)}
.row .kcal{font-weight:600;font-size:14px}
.x{border:none;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}
.empty{font-size:14px;color:var(--muted);padding:14px 2px}

.in{background:var(--paper);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:11px 12px;width:100%;-webkit-user-select:text;user-select:text}
.in::placeholder{color:var(--muted)}
label.f{display:block;margin-bottom:12px}
label.f span{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}

.btn{border:none;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:600;
  width:100%;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.gold{background:var(--intake)}
.btn.teal{background:var(--burn)}
.btn[disabled]{background:var(--muted)}

.dock{position:fixed;bottom:0;left:0;right:0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--canvas) 62%,transparent)}
.dock .wrap2{max-width:480px;margin:0 auto}

.sheet-bg{position:fixed;inset:0;background:rgba(24,36,30,.5);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--canvas);width:100%;max-height:93vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:20px 18px calc(30px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-head h3{font-size:17px;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:9px;padding:9px 0;font-size:13px;font-weight:600}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hide{display:none!important}

.pick{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;margin-bottom:6px;width:100%;text-align:left}
.pick .body{flex:1;min-width:0}
.grouphead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin:14px 0 6px;font-weight:600}
.list{max-height:46vh;overflow-y:auto;margin-bottom:12px}
.mult{display:flex;gap:6px;margin-bottom:12px}
.mult button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:9px;padding:10px 0;font-size:14px}
.mult button.on{background:var(--burn);color:#fff;border-color:var(--burn)}
.two{display:flex;gap:10px}
.two > *{flex:1}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
.err{font-size:13px;color:var(--warn);margin-bottom:10px}
.check{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.check input{width:19px;height:19px;accent-color:var(--burn)}
.tag{font-size:11px;color:var(--burn);font-weight:600}

.setup{position:fixed;inset:0;background:var(--canvas);z-index:60;overflow-y:auto;padding:22px 16px}
.setup .inner{max-width:480px;margin:0 auto}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:10px;padding:11px 0;font-size:14px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:13px;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.switch .t{font-size:14px}
.switch .d{font-size:11px;color:var(--muted)}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--line);border:none;position:relative;flex:0 0 auto}
.toggle.on{background:var(--burn)}
.toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;
  background:#fff;transition:left .18s ease}
.toggle.on i{left:23px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<div class="dock" id="dock">
  <div class="wrap2"><button class="btn" onclick="openAdd()">Add a meal</button></div>
</div>

<div id="sheet"></div>
<div id="setup"></div>

<script>
/* ============================================================

   ============================================================ */
const FOODS = [

["Fruit","Blueberries, 1 cup",84,1],

["Vegetables","Spinach, 1 cup raw",7,1],
["Vegetables","Bok choy, 1 cup cooked",20,3],
["Vegetables","Carrot, 1 medium",25,1],
["Vegetables","Tomato, 1 medium",22,1],
["Vegetables","Cucumber, half",20,1],
["Vegetables","Green beans, 1 cup",44,2],
["Vegetables","Corn, 1 cup",130,5],
["Vegetables","Mixed salad, 2 cups no dressing",20,2],
["Vegetables","Stir-fried vegetables, 1 plate",120,4],
["Nuts & fats","Almonds, 30g",170,6],
["Nuts & fats","Peanuts, 30g",165,7],
["Nuts & fats","Walnuts, 30g",185,4],
["Nuts & fats","Peanut butter, 2 tbsp",190,8],
["Nuts & fats","Olive oil, 1 tbsp",120,0],
["Nuts & fats","Cooking oil, 1 tbsp",120,0],
["Drinks","Black coffee",5,0],
["Drinks","Tea, plain",2,0],
["Drinks","Latte, medium",190,10],
["Drinks","Orange juice, 1 cup",112,2],
["Drinks","Soda, 1 can",140,0],
["Drinks","Sports drink, 1 bottle",125,0],
["Drinks","Bubble tea, medium",350,5],
["Drinks","Beer, 1 bottle",150,2],
["Drinks","Wine, 1 glass",125,0],
["Meals out","Hamburger, plain",250,12],
["Meals out","Cheeseburger",300,15],
["Meals out","Large burger",520,30],
["Meals out","French fries, medium",340,4],
["Meals out","Pizza, 1 slice cheese",285,12],
["Meals out","Fried chicken, 1 piece",320,22],
["Meals out","Turkey sandwich",350,20],
["Meals out","Sushi roll, 6 pieces",250,9],
["Meals out","Ramen, 1 bowl",500,20],
["Meals out","Pho, 1 bowl",400,25],
["Meals out","Burrito",600,25],
["Meals out","Caesar salad with chicken",400,30],
["Snacks","Potato chips, small bag",155,2],
["Snacks","Chocolate bar, 45g",235,3],
["Snacks","Cookie, 1 medium",80,1],
["Snacks","Ice cream, half cup",140,2],
["Snacks","Donut, glazed",250,3],
["Snacks","Cake, 1 slice",350,4],
["Snacks","Popcorn, 3 cups plain",90,3],
["Snacks","Protein bar",200,20]
];

/* ============================================================
   2. STORAGE
   ============================================================ */
const K = { profile:"cl.profile", mine:"cl.mine", hist:"cl.history", day:d=>"cl.day."+d };

function load(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ alert("Couldn't save. Your phone's storage for this site may be full."); return false; }
}

const todayKey = () => {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
const prettyDate = k => {
  const [y,m,d] = k.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
};
const shortDate = k => {
  const [y,m,d] = k.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"});
};
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => Math.max(0, Math.round(Number(v)||0));

/* ============================================================
   3. STATE
   ============================================================ */
let profile = load(K.profile, null);
let mine    = load(K.mine, []);
let history = load(K.hist, {});
let day     = load(K.day(todayKey()), null) || { date: todayKey(), food:[], watchActive:0, burn:[] };
let view    = "today";

function bmr(){
  if(!profile || !profile.weightKg || !profile.heightCm || !profile.age) return 0;
  const b = 10*profile.weightKg + 6.25*profile.heightCm - 5*profile.age;
  return Math.round(profile.sex === "female" ? b - 161 : b + 5);
}
const eaten   = () => day.food.reduce((s,f)=>s+f.kcal,0);
const protein = () => day.food.reduce((s,f)=>s+(f.protein||0),0);
const burned  = () => bmr() + (day.watchActive||0) + day.burn.reduce((s,b)=>s+b.kcal,0);

function persist(){
  save(K.day(day.date), day);
  history[day.date] = { in: eaten(), out: burned(), p: protein() };
  save(K.hist, history);
  render();
}
function rememberFood(name, kcal, p){
  if(!name) return;
  const key = name.trim().toLowerCase();
  const i = mine.findIndex(f => f.name.trim().toLowerCase() === key);
  const rec = { id: i>-1 ? mine[i].id : uid(), name: name.trim(), kcal, protein: p };
  if(i>-1) mine[i] = rec; else mine.unshift(rec);
  save(K.mine, mine);
}

/* ============================================================
   4. TODAY / HISTORY / SETTINGS VIEWS
   ============================================================ */
function render(){
  document.getElementById("dock").className = view === "today" ? "dock" : "dock hide";
  const el = document.getElementById("app");
  el.innerHTML = topbar() + (view==="today" ? todayView() : view==="history" ? histView() : setView());
}

function topbar(){
  return `<div class="topbar">
    <div>
      <div class="eyebrow">${view==="today"?"Today":view==="history"?"Record":"Settings"}</div>
      <div class="date">${view==="today"?prettyDate(day.date):view==="history"?"Your history":"Your setup"}</div>
    </div>
    <div>
      <button class="chipbtn ${view==="history"?"on":""}" onclick="go('history')">History</button>
      <button class="chipbtn ${view==="settings"?"on":""}" onclick="go('settings')">Settings</button>
    </div>
  </div>`;
}
function go(v){ view = (view===v) ? "today" : v; render(); window.scrollTo(0,0); }

function todayView(){
  const e = eaten(), b = burned(), net = e - b, span = Math.max(e,b,1);
  const showP = profile && profile.showProtein;
  const target = profile && profile.target ? profile.target : 0;

  let html = `<div class="card">
    <div class="eyebrow">${net>=0?"Surplus":"Deficit"}</div>
    <div class="big num" style="color:${net>=0?"var(--intake)":"var(--burn)"}">
      ${net>=0?"+":"\u2212"}${Math.abs(net).toLocaleString()}
    </div>
    <div class="bar-label"><span class="eyebrow">Eaten</span>
      <span class="num" style="color:var(--intake);font-size:13px;font-weight:600">${e.toLocaleString()}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${e/span*100}%;background:var(--intake)"></div></div>
    <div class="bar-label"><span class="eyebrow">Burned</span>
      <span class="num" style="color:var(--burn);font-size:13px;font-weight:600">${b.toLocaleString()}</span></div>
    <div class="bar-track" style="margin-bottom:0"><div class="bar-fill" style="width:${b/span*100}%;background:var(--burn)"></div></div>
    ${target ? `<div class="note">Target ${target.toLocaleString()} eaten \u2014 ${e<=target
        ? (target-e).toLocaleString()+" left" : (e-target).toLocaleString()+" over"}</div>` : ""}
    ${showP ? `<div class="note">Protein today: <b class="num">${protein()}g</b></div>` : ""}
  </div>`;

  html += `<h2 class="sec"><span>Burned</span><span class="num" style="color:var(--burn)">${b.toLocaleString()}</span></h2>`;
  html += row("Resting burn", "Breathing, thinking, digesting \u2014 all day", bmr(), "var(--burn)");
  html += `<div class="row">
    <div class="body"><div class="name">Active calories</div>
      <div class="sub">From your watch \u2014 the active/move number, not total</div></div>
    <input class="in num" type="number" inputmode="numeric" placeholder="0" style="width:84px;padding:7px 9px;text-align:right"
      value="${day.watchActive||""}" onchange="setActive(this.value)">
  </div>`;
  day.burn.forEach(x => { html += row(x.label, null, x.kcal, "var(--burn)", `delBurn('${x.id}')`); });
  html += `<button class="btn ghost" style="margin-top:6px" onclick="openBurn()">Add another workout</button>`;

  html += `<h2 class="sec"><span>Eaten</span><span class="num" style="color:var(--intake)">${e.toLocaleString()}</span></h2>`;
  if(!day.food.length) html += `<div class="empty">Nothing logged yet. Tap "Add a meal" to start.</div>`;
  else day.food.forEach(f => {
    const sub = showP && f.protein ? f.protein+"g protein" : null;
    html += row(f.name, sub, f.kcal, "var(--intake)", `delFood('${f.id}')`);
  });
  return html;
}

function row(name, sub, kcal, color, onDel){
  return `<div class="row"><div class="body">
    <div class="name">${esc(name)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}
    </div><span class="kcal num" style="color:${color||"var(--ink)"}">${kcal.toLocaleString()}</span>
    ${onDel?`<button class="x" onclick="${onDel}" aria-label="Remove">\u00d7</button>`:""}</div>`;
}

function histView(){
  const keys = Object.keys(history).sort().reverse().slice(0,30);
  if(!keys.length) return `<div class="empty">Nothing recorded yet. Your days will stack up here.</div>`;
  const recent = keys.slice(0,7);
  const avg = Math.round(recent.reduce((s,k)=>s+(history[k].in-history[k].out),0)/recent.length);
  let html = `<div class="card" style="margin-bottom:8px">
    <div class="eyebrow">7-day average balance</div>
    <div class="big num" style="margin-bottom:0;color:${avg>=0?"var(--intake)":"var(--burn)"}">
      ${avg>=0?"+":"\u2212"}${Math.abs(avg).toLocaleString()}</div>
    <div class="note">Daily swings are normal \u2014 the average over a week tells you more than any single day.</div>
  </div>`;
  keys.forEach(k => {
    const h = history[k], net = h.in - h.out;
    html += row(shortDate(k), h.in.toLocaleString()+" in \u00b7 "+h.out.toLocaleString()+" out",
      net, net>=0?"var(--intake)":"var(--burn)");
  });
  return html;
}

function setView(){
  const p = profile||{};
  let html = `<h2 class="sec">Body stats</h2>`;
  html += row("Resting burn", `${p.sex==="female"?"Female":"Male"}, ${p.age}, ${p.heightCm}cm, ${p.weightKg}kg`, bmr(), "var(--burn)");
  html += `<button class="btn ghost" style="margin-top:6px" onclick="openSetup()">Edit my stats</button>`;

  html += `<h2 class="sec">Options</h2>
  <div class="switch"><div><div class="t">Track protein</div>
    <div class="d">Adds one optional field per food</div></div>
    <button class="toggle ${p.showProtein?"on":""}" onclick="toggleProtein()" aria-label="Track protein"><i></i></button></div>
  <label class="f" style="margin-top:8px"><span>Daily calorie target (optional \u2014 leave blank for none)</span>
    <input class="in num" type="number" inputmode="numeric" placeholder="none"
      value="${p.target||""}" onchange="setTarget(this.value)"></label>`;

  html += `<h2 class="sec">My saved foods (${mine.length})</h2>`;
  if(!mine.length) html += `<div class="empty">Foods you enter yourself get saved here for one-tap reuse.</div>`;
  else mine.forEach(f => html += row(f.name, f.protein?f.protein+"g protein":null, f.kcal, "var(--intake)", `delMine('${f.id}')`));

  html += `<h2 class="sec">Backup</h2>
  <div class="note" style="margin:0 0 10px">Your data lives only on this phone. Clearing your browser data would erase it, so export a copy now and then.</div>
  <button class="btn ghost" style="margin-bottom:8px" onclick="exportData()">Export my data</button>
  <button class="btn ghost" onclick="importData()">Restore from a backup</button>`;
  return html;
}

/* ============================================================
   5. ACTIONS
   ============================================================ */
function setActive(v){ day.watchActive = n(v); persist(); }
function delFood(id){ day.food = day.food.filter(f=>f.id!==id); persist(); }
function delBurn(id){ day.burn = day.burn.filter(b=>b.id!==id); persist(); }
function delMine(id){ mine = mine.filter(f=>f.id!==id); save(K.mine,mine); render(); }
function setTarget(v){ profile.target = n(v)||0; save(K.profile,profile); render(); }
function toggleProtein(){ profile.showProtein = !profile.showProtein; save(K.profile,profile); render(); }

function openBurn(){
  const label = prompt("What did you do?");
  if(!label) return;
  const kc = prompt("How many calories did it burn?");
  if(kc===null) return;
  day.burn.push({ id:uid(), label:label.trim(), kcal:n(kc) });
  persist();
}

function exportData(){
  const dump = { v:1, exported:new Date().toISOString(), profile, mine, history, days:{} };
  Object.keys(history).forEach(k => { const d = load(K.day(k), null); if(d) dump.days[k] = d; });
  const blob = new Blob([JSON.stringify(dump,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ledger-backup-"+todayKey()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if(!d.profile) throw new Error("bad");
        if(!confirm("This replaces everything currently in the app. Continue?")) return;
        profile = d.profile; mine = d.mine||[]; history = d.history||{};
        save(K.profile,profile); save(K.mine,mine); save(K.hist,history);
        Object.keys(d.days||{}).forEach(k => save(K.day(k), d.days[k]));
        day = load(K.day(todayKey()), null) || { date:todayKey(), food:[], watchActive:0, burn:[] };
        view = "today"; render();
        alert("Restored.");
      } catch(e){ alert("That file isn't a Ledger backup."); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============================================================
   6. ADD-FOOD SHEET
   ============================================================ */
let addTab = "search", picked = null, mult = 1;

function openAdd(){ addTab="search"; picked=null; mult=1; drawAdd(); }
function closeSheet(){ document.getElementById("sheet").innerHTML = ""; }
function setTab(t){ addTab=t; picked=null; drawAdd(); }
function setMult(m){ mult=m; drawAdd(); }

function drawAdd(){
  const showP = profile && profile.showProtein;
  let inner = "";

  if(picked){
    const kc = Math.round(picked.kcal*mult), pr = Math.round((picked.protein||0)*mult);
    inner = `<div class="card" style="margin-bottom:14px">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px">${esc(picked.name)}</div>
      <div class="mult">
        ${[0.5,1,1.5,2].map(m=>`<button class="${mult===m?"on":""}" onclick="setMult(${m})">${m}\u00d7</button>`).join("")}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:13px;color:var(--muted)">Calories</span>
        <span class="num" style="font-size:26px;font-weight:600;color:var(--intake)">${kc.toLocaleString()}</span>
      </div>
      ${showP?`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px">
        <span style="font-size:13px;color:var(--muted)">Protein</span>
        <span class="num" style="font-size:15px;font-weight:600">${pr}g</span></div>`:""}
    </div>
    <button class="btn gold" onclick="commitPicked()">Add to today</button>
    <button class="btn ghost" style="margin-top:8px" onclick="picked=null;drawAdd()">Back</button>`;
  }
  else if(addTab==="search"){
    inner = `<input class="in" id="q" placeholder="Search foods\u2026" oninput="drawList(this.value)" autocomplete="off">
      <div class="list" id="list"></div>`;
  }
  else if(addTab==="quick"){
    inner = `<label class="f"><span>What was it?</span>
        <input class="in" id="qn" placeholder="Chicken salad from the deli"></label>
      <div class="two">
        <label class="f"><span>Calories</span>
          <input class="in num" id="qk" type="number" inputmode="numeric" placeholder="0"></label>
        ${showP?`<label class="f"><span>Protein (g)</span>
          <input class="in num" id="qp" type="number" inputmode="numeric" placeholder="0"></label>`:""}
      </div>
      <div class="check"><input type="checkbox" id="qs" checked>
        <label for="qs">Save to my foods for next time</label></div>
      <div class="err hide" id="qerr"></div>
      <button class="btn gold" onclick="commitQuick()">Add to today</button>
      <div class="note">Photograph the meal, ask any AI chat for a calorie estimate, then type the number here.
        Tap "Copy prompt" below to get a wording that returns clean numbers.</div>
      <button class="btn ghost" style="margin-top:8px" onclick="copyPrompt()">Copy prompt for the AI</button>`;
  }
  else {
    inner = `<label class="f"><span>Product name</span>
        <input class="in" id="ln" placeholder="Greek yogurt, strawberry"></label>
      <div class="two">
        <label class="f"><span>Calories per serving</span>
          <input class="in num" id="lk" type="number" inputmode="numeric" placeholder="0" oninput="labelPreview()"></label>
        ${showP?`<label class="f"><span>Protein per serving (g)</span>
          <input class="in num" id="lp" type="number" inputmode="numeric" placeholder="0" oninput="labelPreview()"></label>`:""}
      </div>
      <label class="f"><span>How many servings did you eat?</span>
        <input class="in num" id="ls" type="number" inputmode="decimal" step="0.25" value="1" oninput="labelPreview()"></label>
      <div class="card" style="margin-bottom:12px;padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:13px;color:var(--muted)">That comes to</span>
          <span class="num" id="lprev" style="font-size:26px;font-weight:600;color:var(--intake)">0</span>
        </div></div>
      <div class="check"><input type="checkbox" id="lsv" checked>
        <label for="lsv">Save to my foods for next time</label></div>
      <div class="err hide" id="lerr"></div>
      <button class="btn gold" onclick="commitLabel()">Add to today</button>
      <div class="note">Read the two numbers straight off the panel. Watch the serving size \u2014
        a bag that looks like one portion is often listed as two or three.</div>`;
  }

  document.getElementById("sheet").innerHTML = `
    <div class="sheet-bg" onclick="if(event.target===this)closeSheet()">
      <div class="sheet">
        <div class="sheet-head"><h3>Add a meal</h3>
          <button class="x" style="font-size:26px" onclick="closeSheet()">\u00d7</button></div>
        ${picked?"":`<div class="tabs">
          <button class="tab ${addTab==="search"?"on":""}" onclick="setTab('search')">Search</button>
          <button class="tab ${addTab==="quick"?"on":""}" onclick="setTab('quick')">Quick add</button>
          <button class="tab ${addTab==="label"?"on":""}" onclick="setTab('label')">Label</button>
        </div>`}
        ${inner}
      </div>
    </div>`;
  if(!picked && addTab==="search") drawList("");
}

let listRows = [];
function drawList(q){
  q = (q||"").trim().toLowerCase();
  const el = document.getElementById("list"); if(!el) return;
  listRows = [];
  let html = "";
  const mn = mine.filter(f => !q || f.name.toLowerCase().includes(q));
  if(mn.length){
    html += `<div class="grouphead">My foods</div>`;
    mn.forEach(f => html += pickBtn({name:f.name, kcal:f.kcal, protein:f.protein}, true));
  }
  const groups = {};
  FOODS.forEach(([g,name,kc,p]) => {
    if(q && !name.toLowerCase().includes(q) && !g.toLowerCase().includes(q)) return;
    (groups[g] = groups[g] || []).push({name, kcal:kc, protein:p});
  });
  Object.keys(groups).forEach(g => {
    html += `<div class="grouphead">${g}</div>`;
    groups[g].forEach(f => html += pickBtn(f, false));
  });
  if(!html) html = `<div class="empty">No match. Use "Quick add" to enter it yourself \u2014
    it'll be saved for next time.</div>`;
  el.innerHTML = html;
}
function pickBtn(f, isMine){
  const i = listRows.push(f) - 1;
  const showP = profile && profile.showProtein;
  return `<button class="pick" onclick="pickIdx(${i})">
    <div class="body"><div class="name">${esc(f.name)}</div>
      ${isMine?`<div class="sub"><span class="tag">Saved</span></div>`
        :showP&&f.protein?`<div class="sub">${f.protein}g protein</div>`:""}</div>
    <span class="kcal num" style="color:var(--intake)">${f.kcal}</span></button>`;
}
function pickIdx(i){ picked = listRows[i]; mult = 1; drawAdd(); }

function commitPicked(){
  if(!picked) return;
  commit(picked.name, Math.round(picked.kcal*mult), Math.round((picked.protein||0)*mult));
}
function commit(name, kcal, prot){
  day.food.push({ id:uid(), name, kcal:n(kcal), protein:n(prot), ts:Date.now() });
  closeSheet(); persist();
}
function commitQuick(){
  const name = (document.getElementById("qn").value||"").trim();
  const kc = n(document.getElementById("qk").value);
  const pEl = document.getElementById("qp");
  const pr = pEl ? n(pEl.value) : 0;
  const err = document.getElementById("qerr");
  if(!name || !kc){ err.textContent = "Give it a name and a calorie number."; err.classList.remove("hide"); return; }
  if(document.getElementById("qs").checked) rememberFood(name, kc, pr);
  commit(name, kc, pr);
}
function labelPreview(){
  const kc = n(document.getElementById("lk").value);
  const sv = Number(document.getElementById("ls").value)||0;
  const el = document.getElementById("lprev");
  if(el) el.textContent = Math.round(kc*sv).toLocaleString();
}
function commitLabel(){
  const name = (document.getElementById("ln").value||"").trim();
  const kc = n(document.getElementById("lk").value);
  const sv = Number(document.getElementById("ls").value)||0;
  const pEl = document.getElementById("lp");
  const pr = pEl ? n(pEl.value) : 0;
  const err = document.getElementById("lerr");
  if(!name || !kc || !sv){ err.textContent = "Fill in the name, the calories per serving, and the servings."; err.classList.remove("hide"); return; }
  if(document.getElementById("lsv").checked) rememberFood(name+" (1 serving)", kc, pr);
  commit(name, Math.round(kc*sv), Math.round(pr*sv));
}
function copyPrompt(){
  const t = "Look at this photo of my meal. Estimate the portion sizes and tell me the total calories"
    + ((profile&&profile.showProtein)?" and total protein in grams":"")
    + ". Reply with just a short list of items with their numbers, then the total. Say what portion size you assumed.";
  navigator.clipboard.writeText(t).then(
    () => alert("Prompt copied. Paste it with your photo into any AI chat."),
    () => prompt("Copy this prompt:", t)
  );
}

/* ============================================================
   7. SETUP SCREEN
   ============================================================ */
let sf = {};
function openSetup(){
  sf = profile ? Object.assign({}, profile) : { sex:"female", units:"metric" };
  drawSetup();
}
function setSF(k,v){ sf[k]=v; drawSetup(); }
function readSF(k,v){ sf[k]=v; drawSetupPreview(); }
function sfBmr(){
  const h = sf.units==="metric" ? Number(sf.heightCm)||0 : (Number(sf.heightIn)||0)*2.54;
  const w = sf.units==="metric" ? Number(sf.weightKg)||0 : (Number(sf.weightLb)||0)*0.4536;
  const a = Number(sf.age)||0;
  if(!h||!w||!a) return 0;
  const b = 10*w + 6.25*h - 5*a;
  return Math.round(sf.sex==="female" ? b-161 : b+5);
}
function drawSetupPreview(){
  const el = document.getElementById("bmrPrev"); if(!el) return;
  const v = sfBmr();
  el.innerHTML = v ? `<div class="card" style="margin-bottom:16px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:3px">Your resting burn</div>
      <div class="num" style="font-size:26px;font-weight:600;color:var(--burn)">
        ${v.toLocaleString()} <span style="font-size:13px;color:var(--muted)">cal / day</span></div></div>` : "";
}
function drawSetup(){
  const metric = sf.units === "metric";
  document.getElementById("setup").innerHTML = `<div class="setup"><div class="inner">
    <div class="sheet-head"><h3>Your body stats</h3>
      ${profile?`<button class="x" style="font-size:26px" onclick="closeSetup()">\u00d7</button>`:""}</div>
    <p class="note" style="margin:0 0 18px">These calculate your resting burn \u2014 the calories your body
      spends breathing, thinking, and digesting before you move at all.</p>
    <div class="seg">
      <button class="${metric?"on":""}" onclick="setSF('units','metric')">kg / cm</button>
      <button class="${!metric?"on":""}" onclick="setSF('units','imperial')">lb / in</button></div>
    <div class="seg">
      <button class="${sf.sex==="female"?"on":""}" onclick="setSF('sex','female')">Female</button>
      <button class="${sf.sex==="male"?"on":""}" onclick="setSF('sex','male')">Male</button></div>
    <label class="f"><span>Age</span><input class="in num" type="number" inputmode="numeric"
      placeholder="30" value="${sf.age||""}" oninput="readSF('age',this.value)"></label>
    ${metric
      ? `<label class="f"><span>Height (cm)</span><input class="in num" type="number" inputmode="decimal"
          placeholder="170" value="${sf.heightCm||""}" oninput="readSF('heightCm',this.value)"></label>
         <label class="f"><span>Weight (kg)</span><input class="in num" type="number" inputmode="decimal"
          placeholder="65" value="${sf.weightKg||""}" oninput="readSF('weightKg',this.value)"></label>`
      : `<label class="f"><span>Height (inches)</span><input class="in num" type="number" inputmode="decimal"
          placeholder="67" value="${sf.heightIn||""}" oninput="readSF('heightIn',this.value)"></label>
         <label class="f"><span>Weight (lb)</span><input class="in num" type="number" inputmode="decimal"
          placeholder="145" value="${sf.weightLb||""}" oninput="readSF('weightLb',this.value)"></label>`}
    <div id="bmrPrev"></div>
    <button class="btn" onclick="saveSetup()">Save stats</button>
    <p class="note">Calculated with the Mifflin\u2013St Jeor equation. It's a population estimate,
      so your real number may differ by a few hundred calories. Update your weight every few weeks.</p>
  </div></div>`;
  drawSetupPreview();
}
function closeSetup(){ document.getElementById("setup").innerHTML = ""; }
function saveSetup(){
  if(!sfBmr()){ alert("Fill in your age, height, and weight first."); return; }
  const metric = sf.units === "metric";
  profile = {
    sex: sf.sex, units: sf.units, age: Number(sf.age),
    heightCm: Math.round(metric ? Number(sf.heightCm) : Number(sf.heightIn)*2.54),
    weightKg: Math.round(metric ? Number(sf.weightKg) : Number(sf.weightLb)*0.4536),
    heightIn: sf.heightIn, weightLb: sf.weightLb,
    showProtein: profile ? !!profile.showProtein : false,
    target: profile ? profile.target||0 : 0
  };
  save(K.profile, profile);
  closeSetup(); persist();
}

/* ============================================================
   8. BOOT
   ============================================================ */
// Roll over to a new day if the app was left open overnight
setInterval(() => {
  if(day.date !== todayKey()){
    day = load(K.day(todayKey()), null) || { date:todayKey(), food:[], watchActive:0, burn:[] };
    render();
  }
}, 60000);

render();
if(!profile) openSetup();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
