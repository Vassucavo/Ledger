<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4EAE3">
<title>记账本</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{
  --canvas:#E4EAE3; --paper:#F8FAF6; --ink:#18241E; --muted:#78877E;
  --line:#C9D3C6; --intake:#A87C15; --burn:#1D6B67; --warn:#8C4A2F;
  --tabh:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Source Han Sans SC",
    "Microsoft YaHei",sans-serif;
  background:var(--canvas); color:var(--ink); min-height:100vh;
  font-size:15px; line-height:1.5; -webkit-user-select:none; user-select:none;
}
input,button,select,textarea{font-family:inherit;font-size:16px}
.num{font-variant-numeric:tabular-nums;
  font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--burn);outline-offset:2px}

.wrap{max-width:480px;margin:0 auto;
  padding:16px 16px calc(var(--tabh) + 84px + env(safe-area-inset-bottom))}

/* ---------- header ---------- */
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:42px}
.backb{border:1px solid var(--line);background:var(--paper);border-radius:9px;
  width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;padding:0}
.head .titles{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.title{font-size:18px;font-weight:600}

/* date stepper on the Today screen */
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.datenav button{border:1px solid var(--line);background:var(--paper);border-radius:9px;
  width:36px;height:36px;display:grid;place-items:center;padding:0;flex:0 0 auto}
.datenav button[disabled]{opacity:.35}
.datenav .d{flex:1;text-align:center;font-size:14px;font-weight:600}
.datenav .d small{display:block;font-size:11px;color:var(--muted);font-weight:400}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.big{font-size:42px;font-weight:600;line-height:1.05}
.bar-label{display:flex;justify-content:space-between;margin-bottom:4px}
.bar-track{height:9px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:11px}
.bar-fill{height:100%;border-radius:5px;transition:width .4s ease}

h2.sec{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600;
  margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.rowb{width:100%;text-align:left}
.row .body{flex:1;min-width:0}
.row .name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11px;color:var(--muted)}
.row .kcal{font-weight:600;font-size:14px}
.x{border:none;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
.empty{font-size:14px;color:var(--muted);padding:14px 2px;line-height:1.6}

.in{background:var(--paper);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:11px 12px;width:100%;-webkit-user-select:text;user-select:text}
.in::placeholder{color:var(--muted)}
label.f{display:block;margin-bottom:12px}
label.f span{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}

.btn{border:none;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:600;
  width:100%;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.gold{background:var(--intake)}
.btn.teal{background:var(--burn)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}

/* ---------- bottom tab bar: 5 fixed columns, never wraps ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:none;padding:8px 2px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.tabbar button.on{color:var(--burn)}
.tabbar .lb{font-size:10px;line-height:1}
.tabbar svg{width:21px;height:21px;display:block}

.fab{position:fixed;left:0;right:0;z-index:39;
  bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom));
  padding:0 16px;pointer-events:none}
.fab .inner{max-width:480px;margin:0 auto;pointer-events:auto}
.fab .btn{box-shadow:0 6px 18px rgba(24,36,30,.22)}

/* when the soft keyboard is up, get out of the way */
body.kb .tabbar,body.kb .fab{display:none}

/* ---------- sheets & dialogs ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(24,36,30,.5);z-index:50;
  display:flex;align-items:flex-end}
.sheet{background:var(--canvas);width:100%;max-height:93vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-head h3{font-size:17px;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:9px;padding:9px 0;font-size:13px;font-weight:600}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.dlg-bg{position:fixed;inset:0;background:rgba(24,36,30,.5);z-index:70;
  display:flex;align-items:center;justify-content:center;padding:22px}
.dlg{background:var(--canvas);border-radius:16px;padding:20px;width:100%;max-width:380px;
  max-height:86vh;overflow-y:auto}
.dlg h3{font-size:17px;font-weight:600;margin-bottom:6px}
.dlg .msg{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.dlg .acts{display:flex;gap:8px;margin-top:6px}
.dlg .acts .btn{flex:1}

.pick{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;margin-bottom:6px;width:100%;text-align:left}
.pick .body{flex:1;min-width:0}
.grouphead{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px;font-weight:600}
.list{max-height:44vh;overflow-y:auto;margin-bottom:12px}
.mult{display:flex;gap:6px;margin-bottom:12px}
.mult button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:9px;padding:10px 0;font-size:14px}
.mult button.on{background:var(--burn);color:#fff;border-color:var(--burn)}
.two{display:flex;gap:10px}
.two > *{flex:1}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
.err{font-size:13px;color:var(--warn);margin-bottom:10px}
.check{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.check input{width:19px;height:19px;accent-color:var(--burn)}
.tag{font-size:11px;color:var(--burn);font-weight:600}
.hide{display:none!important}

.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:10px;padding:11px 0;font-size:14px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:13px;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;gap:12px}
.switch .t{font-size:14px}
.switch .d{font-size:11px;color:var(--muted)}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--line);border:none;
  position:relative;flex:0 0 auto}
.toggle.on{background:var(--burn)}
.toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;
  background:#fff;transition:left .18s ease}
.toggle.on i{left:23px}

.setup{position:fixed;inset:0;background:var(--canvas);z-index:60;overflow-y:auto;padding:22px 16px}
.setup .inner{max-width:480px;margin:0 auto}
.spark{width:100%;height:112px;display:block;margin-top:10px}
.callout{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--burn);
  border-radius:10px;padding:14px;margin-bottom:10px}
.callout h4{font-size:13px;font-weight:600;margin-bottom:6px}
.callout p{font-size:13px;color:var(--muted);line-height:1.6}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;
  border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:15px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 70px);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;
  z-index:90;max-width:82%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* =====================================================================

const MIN_SPAN = 14;        // 校准要求的最短跨度(天)

/* ---------- 内置食物库:[分组, 名称, 热量, 蛋白质g] ---------- */

/* ---------- 存储 ---------- */
const K = { profile:"cl.profile", mine:"cl.mine", hist:"cl.history",
            weights:"cl.weights", day:d=>"cl.day."+d };
function load(k,f){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));return true;}
  catch(e){ toast("保存失败,存储空间可能已满"); return false; } }

const pad=x=>String(x).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey = () => keyOf(new Date());
const dParse = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const shiftKey = (k,n) => keyOf(new Date(dParse(k).getTime()+n*86400000));
const daysBetween = (a,b) => Math.round((dParse(b)-dParse(a))/86400000);
const WD = ["周日","周一","周二","周三","周四","周五","周六"];
const cnDate = k => { const d=dParse(k); return (d.getMonth()+1)+"月"+d.getDate()+"日"; };
const cnFull = k => { const d=dParse(k); return cnDate(k)+" "+WD[d.getDay()]; };
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => Math.max(0,Math.round(Number(v)||0));
const f1 = v => (Math.round(v*10)/10).toFixed(1);

/* ---------- 状态 ---------- */
let profile = load(K.profile,null);
let mine    = load(K.mine,[]);
let history = load(K.hist,{});
let weights = load(K.weights,[]);
let curDate = todayKey();
let day     = loadDay(curDate);
let view    = "today";

function loadDay(k){ return load(K.day(k),null) || {date:k,food:[],watchActive:0,burn:[]}; }
function bmr(){
  if(!profile||!profile.weightKg||!profile.heightCm||!profile.age) return 0;
  const b = 10*profile.weightKg + 6.25*profile.heightCm - 5*profile.age;
  return Math.round(profile.sex==="female" ? b-161 : b+5);
}
const eaten   = () => day.food.reduce((s,f)=>s+f.kcal,0);
const protein = () => day.food.reduce((s,f)=>s+(f.protein||0),0);
const burned  = () => bmr() + (day.watchActive||0) + day.burn.reduce((s,b)=>s+b.kcal,0);
const target  = () => (profile && profile.target) ? profile.target : 0;

function persist(){
  const empty = !day.food.length && !day.watchActive && !day.burn.length;
  if(empty){ try{localStorage.removeItem(K.day(day.date));}catch(e){} delete history[day.date]; }
  else { save(K.day(day.date), day);
    history[day.date] = { in:eaten(), out:burned(), p:protein(), act:day.watchActive||0 }; }
  save(K.hist,history);
  render();
}
function rememberFood(name,kcal,p){
  if(!name) return;
  const key = name.trim().toLowerCase();
  const i = mine.findIndex(f=>f.name.trim().toLowerCase()===key);
  const rec = { id: i>-1?mine[i].id:uid(), name:name.trim(), kcal, protein:p, used:Date.now() };
  if(i>-1) mine[i]=rec; else mine.unshift(rec);
  save(K.mine,mine);
}
function touchFood(name){
  const i = mine.findIndex(f=>f.name.trim().toLowerCase()===String(name).trim().toLowerCase());
  if(i>-1){ mine[i].used = Date.now(); save(K.mine,mine); }
}

/* =====================================================================
   导航栈 —— 支持系统返回键和应用内返回
   ===================================================================== */
let stack = [];
function pushNav(undo){
  stack.push(undo);
  try{ history.pushState({d:stack.length},""); }catch(e){}
}
function popNav(){ const u=stack.pop(); if(u) u(); }
function goBack(){
  if(!stack.length) return false;
  try{ window.history.back(); }catch(e){ popNav(); }
  return true;
}
window.addEventListener("popstate", () => { const u=stack.pop(); if(u) u(); });

/* =====================================================================
   对话框 —— 取代系统的 prompt / alert / confirm
   ===================================================================== */
let dlgFields = [];
function closeDlg(silent){
  document.getElementById("dlg").innerHTML="";
  dlgFields=[];
  if(!silent) {}
}
function showDlg(html){
  document.getElementById("dlg").innerHTML =
    `<div class="dlg-bg" onclick="if(event.target===this)dismissDlg()"><div class="dlg">${html}</div></div>`;
  pushNav(()=>closeDlg(true));
  const first = document.querySelector("#dlg input");
  if(first) setTimeout(()=>first.focus(),120);
}
function dismissDlg(){ goBack() || closeDlg(true); }

/** 提示,只有一个"好"按钮 */
function say(msg,title){
  showDlg(`<h3>${esc(title||"提示")}</h3><div class="msg">${esc(msg)}</div>
    <div class="acts"><button class="btn" onclick="dismissDlg()">好</button></div>`);
}
/** 确认 */
let confirmCb=null;
function ask(msg,title,onYes,danger){
  confirmCb=onYes;
  showDlg(`<h3>${esc(title||"确认")}</h3><div class="msg">${esc(msg)}</div>
    <div class="acts"><button class="btn ghost" onclick="dismissDlg()">取消</button>
    <button class="btn ${danger?"danger":""}" onclick="runConfirm()">确定</button></div>`);
}
function runConfirm(){ const cb=confirmCb; confirmCb=null; dismissDlg(); if(cb) setTimeout(cb,10); }

/**
 * 表单对话框
 * fields: [{k, label, type:'text|number|date', value, ph, step}]
 */
let formCb=null;
function form(title,fields,onOk,okLabel){
  dlgFields=fields; formCb=onOk;
  const body = fields.map(f=>`<label class="f"><span>${esc(f.label)}</span>
    <input class="in ${f.type==="number"?"num":""}" id="fld_${f.k}" type="${f.type||"text"}"
      ${f.type==="number"?'inputmode="decimal"':""} ${f.step?`step="${f.step}"`:""}
      value="${esc(f.value==null?"":f.value)}" placeholder="${esc(f.ph||"")}"></label>`).join("");
  showDlg(`<h3>${esc(title)}</h3>${body}<div class="err hide" id="fld_err"></div>
    <div class="acts"><button class="btn ghost" onclick="dismissDlg()">取消</button>
    <button class="btn teal" onclick="submitForm()">${esc(okLabel||"保存")}</button></div>`);
}
function formError(msg){
  const e=document.getElementById("fld_err");
  if(e){ e.textContent=msg; e.classList.remove("hide"); }
}
function submitForm(){
  const out={};
  dlgFields.forEach(f=>{ const el=document.getElementById("fld_"+f.k); out[f.k]= el?el.value:""; });
  const cb=formCb;
  if(cb && cb(out)!==false){ formCb=null; dismissDlg(); }
}
function toast(msg){
  const el=document.createElement("div");
  el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

/* =====================================================================
   校准
   真实消耗 = 区间平均摄入 − (体重变化kg × 7700 ÷ 天数)
   ===================================================================== */
function calibrate(){
  const w = weights.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(w.length < 2) return {ok:false,reason:"need2",have:w.length};
  const first=w[0], last=w[w.length-1];
  const span = daysBetween(first.date,last.date);
  if(span < MIN_SPAN) return {ok:false,reason:"short",span};
  const days = Object.keys(history).filter(k=>k>=first.date && k<=last.date && history[k].in>0);
  const coverage = days.length/span;
  if(coverage < 0.6) return {ok:false,reason:"sparse",logged:days.length,span};
  const avgIn  = days.reduce((s,k)=>s+history[k].in,0)/days.length;
  const avgOut = days.reduce((s,k)=>s+history[k].out,0)/days.length;
  const deltaKg = last.kg - first.kg;
  const realTDEE = Math.round(avgIn - (deltaKg*KCAL_PER_KG/span));
  return { ok:true, span, days:days.length, coverage,
    avgIn:Math.round(avgIn), avgOut:Math.round(avgOut), deltaKg,
    realTDEE, gap: realTDEE - Math.round(avgOut), perWeek: deltaKg/(span/7) };
}
function suggestTarget(tdee,rate){
  const raw = Math.round(tdee - (rate*KCAL_PER_KG/7));
  const floor = FLOOR[(profile&&profile.sex)==="male"?"male":"female"];
  return { value:Math.max(raw,floor), clamped: raw<floor, floor };
}
function trend(){
  const w = weights.slice().sort((a,b)=>a.date<b.date?-1:1);
  return w.map((pt,i)=>{ const win=w.slice(Math.max(0,i-6),i+1);
    return {date:pt.date, kg:pt.kg, avg: win.reduce((s,x)=>s+x.kg,0)/win.length}; });
}

/* ---------- 体重 ---------- */
function weightView(){
  const t=trend();
  let html="";
  if(t.length){
    const last=t[t.length-1];
    let sub="持续称重才能画出趋势";
    if(t.length>1){
      const d=last.avg-t[0].avg, sp=daysBetween(t[0].date,last.date);
      if(sp>0) sub=`${sp} 天内 ${d>=0?"增加":"减少"} ${f1(Math.abs(d))} kg`;
    }
    html += `<div class="card" style="margin-bottom:10px">
      <div class="eyebrow">趋势体重</div>
      <div class="big num" style="margin-bottom:4px">${f1(last.avg)}
        <span style="font-size:15px;color:var(--muted)">kg</span></div>
      <div class="note" style="margin:0">${sub}</div>${spark(t)}</div>`;
  }
  html += `<button class="btn teal" onclick="addWeight()">记录体重</button>
    <div class="note">尽量固定时间称,最好是早上起床后。
      日常水分和食物造成的波动远大于真正的脂肪变化 —— 看那条实线,不要看散点。</div>`;
  html += `<h2 class="sec">全部记录 <span style="font-weight:400">${weights.length} 条</span></h2>`;
  if(!weights.length) html += `<div class="empty">还没有记录。<br>
    以前自己记过的数据也可以补录进来 —— 记录时能选日期。<br>
    有两条相隔 14 天以上的记录,校准功能就能用了。</div>`;
  else weights.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(w=>
    html += row(cnFull(w.date),"点击可修改",f1(w.kg)+" kg","var(--ink)",
      `delWeight('${w.date}')`,`editWeight('${w.date}')`));
  return html;
}
function spark(t){
  if(t.length<2) return "";
  const W=440,H=112,P=10;
  const xs=t.map(p=>dParse(p.date).getTime());
  const all=t.map(p=>p.kg).concat(t.map(p=>p.avg));
  const lo=Math.min(...all), hi=Math.max(...all), rng=(hi-lo)||1;
  const x=i=>P+((xs[i]-xs[0])/((xs[xs.length-1]-xs[0])||1))*(W-2*P);
  const y=v=>H-P-((v-lo)/rng)*(H-2*P);
  const line=t.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.avg).toFixed(1)}`).join(" ");
  const dots=t.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="2.5"
    fill="var(--muted)" opacity=".5"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
    role="img" aria-label="体重趋势">${dots}
    <path d="${line}" fill="none" stroke="var(--burn)" stroke-width="2.5"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---------- 校准 ---------- */
function tuneView(){
  const c=calibrate();
  if(!c.ok){
    const msg={
      need2:`校准至少需要两条体重记录,现在有 ${c.have||0} 条。`,
      short:`两条记录相隔 ${c.span} 天。校准要等到 ${MIN_SPAN} 天以上 —— 更短的区间里,变化几乎都是水分。`,
      sparse:`区间内 ${c.span} 天里只记录了 ${c.logged} 天的摄入。覆盖率要到 60% 以上,结果才有意义。`
    }[c.reason];
    return `<div class="callout"><h4>数据还不够</h4><p>${msg}</p></div>
      <div class="empty">攒够之后,这一页会把你实际吃了多少和体重实际怎么变的放在一起,
      反推出你真实的每日消耗。这个观测出来的数字,比任何公式都可靠。</div>`;
  }
  const g=c.gap;
  let html=`<div class="card" style="margin-bottom:10px">
    <div class="eyebrow">真实每日消耗</div>
    <div class="big num" style="color:var(--burn);margin-bottom:10px">${c.realTDEE.toLocaleString()}</div>
    <div class="stat"><span class="l">平均摄入</span><span class="v num">${c.avgIn.toLocaleString()}</span></div>
    <div class="stat"><span class="l">体重变化</span>
      <span class="v num">${c.deltaKg>=0?"+":"−"}${f1(Math.abs(c.deltaKg))} kg</span></div>
    <div class="stat"><span class="l">观测区间</span><span class="v num">${c.span} 天</span></div>
    <div class="stat"><span class="l">变化速度</span>
      <span class="v num">${c.perWeek>=0?"+":"−"}${f1(Math.abs(c.perWeek))} kg/周</span></div></div>`;

  html += `<div class="callout"><h4>公式 vs 实测</h4><p>
    应用算出来的平均消耗是 <b>${c.avgOut.toLocaleString()}</b>,
    你身体给出的是 <b>${c.realTDEE.toLocaleString()}</b> —— 
    ${g===0 ? "完全吻合,这种情况很少见。" :
      `公式${g>0?"偏低":"偏高"}了 <b>${Math.abs(g).toLocaleString()}</b>。
       ${g>0 ? "这是预期之中的:基础代谢加手表活动量,漏掉了消化食物本身要花的能量(约占摄入的 10%)。"
             : "手表普遍高估活动卡路里,这大概是主要原因。"}`}
    </p></div>`;

  html += `<h2 class="sec">按这个数字设目标</h2>`;
  [[0.25,"慢一些,最容易坚持"],[0.5,"中等速度"]].forEach(([rate,label])=>{
    const s=suggestTarget(c.realTDEE,rate);
    html += `<div class="row"><div class="body"><div class="name">每周 ${rate} kg</div>
      <div class="sub">${s.clamped?("已抬到下限 "+s.floor):label}</div></div>
      <span class="kcal num" style="color:var(--burn)">${s.value.toLocaleString()}</span>
      <button class="x" style="font-size:13px;font-weight:600;color:var(--burn);padding:6px 8px"
        onclick="applyTarget(${s.value})">采用</button></div>`;
  });
  html += `<div class="note">每隔几周重算一次。体重下降后消耗本身会跟着降,
    第一个月管用的目标,到第三个月就会卡住。
    ${c.coverage<0.85?`当前记录覆盖率 ${Math.round(c.coverage*100)}%,记得越全,这个数字越准。`:""}</div>`;
  return html;
}

/* ---------- 记录 ---------- */
function histView(){
  const keys=Object.keys(history).sort().reverse().slice(0,60);
  if(!keys.length) return `<div class="empty">还没有任何记录。</div>`;
  const recent=keys.slice(0,7);
  const avgNet=Math.round(recent.reduce((s,k)=>s+(history[k].in-history[k].out),0)/recent.length);
  const avgIn=Math.round(recent.reduce((s,k)=>s+history[k].in,0)/recent.length);
  let html=`<div class="card" style="margin-bottom:10px">
    <div class="eyebrow">最近 7 天平均结余</div>
    <div class="big num" style="color:${avgNet>=0?"var(--intake)":"var(--burn)"}">
      ${avgNet>=0?"+":"−"}${Math.abs(avgNet).toLocaleString()}</div>
    <div class="note">平均每天摄入 ${avgIn.toLocaleString()}。
      单日波动很大,以周为单位看才靠谱。</div></div>`;
  keys.forEach(k=>{ const h=history[k], net=h.in-h.out;
    html += row(cnFull(k),`摄入 ${h.in.toLocaleString()} · 消耗 ${h.out.toLocaleString()}`,
      (net>=0?"+":"−")+Math.abs(net).toLocaleString(),
      net>=0?"var(--intake)":"var(--burn)",null,`openDay('${k}')`); });
  return html;
}

/* 体重:可以选日期,方便补录以前的数据 */
function addWeight(){
  const lastKg = weights.length ? weights[weights.length-1].kg : "";
  form("记录体重",[
    {k:"date",label:"日期",type:"date",value:todayKey()},
    {k:"kg",label:"体重(kg)",type:"number",step:"0.1",value:lastKg,ph:"65.0"}
  ],o=>saveWeight(o),"保存");
}
function editWeight(date){
  const w=weights.find(x=>x.date===date); if(!w) return;
  form("修改这条记录",[
    {k:"date",label:"日期",type:"date",value:w.date},
    {k:"kg",label:"体重(kg)",type:"number",step:"0.1",value:w.kg}
  ],o=>saveWeight(o,date),"保存");
}
/* replaceDate:改记录时要顶掉的旧日期。先校验,校验不过绝不改动数据。 */
function saveWeight(o,replaceDate){
  const kg = Math.round(Number(o.kg)*10)/10;
  if(!kg || kg<20 || kg>400){ formError("请输入 20 到 400 之间的体重(kg)。"); return false; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(o.date)){ formError("请选择日期。"); return false; }
  if(daysBetween(o.date,todayKey())<0){ formError("不能记录未来的日期。"); return false; }
  weights = weights.filter(w=>w.date!==o.date && w.date!==replaceDate)
    .concat([{date:o.date,kg}]).sort((a,b)=>a.date<b.date?-1:1);
  save(K.weights,weights);
  // 只有最新那条才回写身体数据里的体重(它决定基础代谢)
  if(profile && weights[weights.length-1].date===o.date){
    profile.weightKg = Math.round(kg); save(K.profile,profile);
  }
  render();
}
function delWeight(date){
  ask("要删除 "+cnFull(date)+" 的体重记录吗?","删除记录",()=>{
    weights=weights.filter(w=>w.date!==date); save(K.weights,weights); render();
  },true);
}

/* ---------- 备份 ---------- */
const NATIVE = () => (typeof Android!=="undefined" && Android && Android.saveBackup);
function exportData(){
  const dump={v:3,exported:new Date().toISOString(),profile,mine,history,weights,days:{}};
  Object.keys(history).forEach(k=>{ const d=load(K.day(k),null); if(d) dump.days[k]=d; });
  const text=JSON.stringify(dump,null,2), name="ledger-"+todayKey()+".json";
  if(NATIVE()){ Android.saveBackup(name,text); return; }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
let pendingRestore=null;
function applyBackup(txt){
  try{
    const d=JSON.parse(txt);
    if(!d.profile && !d.history) throw new Error("bad");
    pendingRestore=d;
    const nDays=Object.keys(d.days||{}).length, nW=(d.weights||[]).length;
    showDlg(`<h3>恢复备份</h3><div class="msg">备份里有 ${nDays} 天的记录、${nW} 条体重。<br><br>
      <b>覆盖</b>:清空当前数据,完全用备份替换。<br>
      <b>合并</b>:保留现有记录,补进备份里有而本机没有的部分,重复的以备份为准。</div>
      <div class="acts"><button class="btn ghost" onclick="dismissDlg()">取消</button>
      <button class="btn teal" onclick="doRestore('merge')">合并</button>
      <button class="btn danger" onclick="doRestore('replace')">覆盖</button></div>`);
  }catch(e){ say("这个文件不是本应用的备份。","无法读取"); }
}
window.applyBackup = applyBackup;
function doRestore(mode){
  const d=pendingRestore; pendingRestore=null; dismissDlg();
  if(!d) return;
  setTimeout(()=>{
    if(mode==="replace"){
      Object.keys(history).forEach(k=>{ try{localStorage.removeItem(K.day(k));}catch(e){} });
      profile=d.profile||profile; mine=d.mine||[]; history=d.history||{}; weights=d.weights||[];
    } else {
      if(!profile) profile=d.profile;
      (d.mine||[]).forEach(f=>{
        if(!mine.some(x=>x.name.trim().toLowerCase()===f.name.trim().toLowerCase())) mine.push(f); });
      history=Object.assign({},history,d.history||{});
      const wm={}; weights.forEach(w=>wm[w.date]=w); (d.weights||[]).forEach(w=>wm[w.date]=w);
      weights=Object.keys(wm).sort().map(k=>wm[k]);
    }
    Object.keys(d.days||{}).forEach(k=>save(K.day(k),d.days[k]));
    save(K.profile,profile); save(K.mine,mine); save(K.hist,history); save(K.weights,weights);
    curDate=todayKey(); day=loadDay(curDate); view="today"; render();
    toast(mode==="replace"?"已覆盖恢复":"已合并恢复");
  },60);
}
function importData(){
  if(NATIVE() && Android.pickBackup){ Android.pickBackup(); return; }
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>applyBackup(r.result); r.readAsText(f); };
  inp.click();
}

/* =====================================================================
   添加餐食
   ===================================================================== */
let addTab="search", picked=null, mult=1, listRows=[];
function openAdd(){ addTab="search"; picked=null; mult=1; drawAdd(); pushNav(()=>closeSheet(true)); }
function closeSheet(silent){ document.getElementById("sheet").innerHTML=""; picked=null; }
function dismissSheet(){ goBack() || closeSheet(true); }
function setTab(t){ addTab=t; picked=null; drawAdd(); }
function setMult(m){ mult=m; drawAdd(); }
function pickIdx(i){ picked=listRows[i]; mult=1; drawAdd(); }

function drawAdd(){
  const showP=profile&&profile.showProtein;
  let inner="";
  if(picked){
    const kc=Math.round(picked.kcal*mult), pr=Math.round((picked.protein||0)*mult);
    inner=`<div class="card" style="margin-bottom:14px">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px">${esc(picked.name)}</div>
      <div class="mult">${[0.5,1,1.5,2].map(m=>
        `<button class="${mult===m?"on":""}" onclick="setMult(${m})">${m} 份</button>`).join("")}</div>
      <div class="stat"><span class="l">热量</span>
        <span class="num" style="font-size:26px;font-weight:600;color:var(--intake)">${kc.toLocaleString()}</span></div>
      ${showP?`<div class="stat"><span class="l">蛋白质</span><span class="v num">${pr}g</span></div>`:""}</div>
      <button class="btn gold" onclick="commitPicked()">加入${curDate===todayKey()?"今天":cnDate(curDate)}</button>
      <button class="btn ghost" style="margin-top:8px" onclick="picked=null;drawAdd()">返回</button>`;
  }
  else if(addTab==="search"){
    inner=`<input class="in" id="q" placeholder="搜索食物…" oninput="drawList(this.value)" autocomplete="off">
      <div class="list" id="list"></div>`;
  }
  else if(addTab==="quick"){
    inner=`<label class="f"><span>吃了什么</span>
        <input class="in" id="qn" placeholder="食堂午餐"></label>
      <div class="two"><label class="f"><span>热量</span>
        <input class="in num" id="qk" type="number" inputmode="numeric" placeholder="0"></label>
        ${showP?`<label class="f"><span>蛋白质(g)</span>
        <input class="in num" id="qp" type="number" inputmode="numeric" placeholder="0"></label>`:""}</div>
      <div class="check"><input type="checkbox" id="qs" checked>
        <label for="qs">存进「我的食物」,下次一键复用</label></div>
      <div class="err hide" id="qerr"></div>
      <button class="btn gold" onclick="commitQuick()">加入记录</button>
      <div class="note">拍下餐食,发给任意 AI 对话问热量,再把数字填到这里。</div>
      <button class="btn ghost" style="margin-top:8px" onclick="copyPrompt()">复制提问用的提示词</button>`;
  }
  else {
    inner=`<label class="f"><span>产品名称</span>
        <input class="in" id="ln" placeholder="希腊酸奶 草莓味"></label>
      <div class="two"><label class="f"><span>每份热量</span>
        <input class="in num" id="lk" type="number" inputmode="numeric" placeholder="0" oninput="labelPreview()"></label>
        ${showP?`<label class="f"><span>每份蛋白质(g)</span>
        <input class="in num" id="lp" type="number" inputmode="numeric" placeholder="0"></label>`:""}</div>
      <label class="f"><span>吃了几份</span>
        <input class="in num" id="ls" type="number" inputmode="decimal" step="0.25" value="1" oninput="labelPreview()"></label>
      <div class="card" style="margin-bottom:12px;padding:14px">
        <div class="stat"><span class="l">合计</span>
        <span class="num" id="lprev" style="font-size:26px;font-weight:600;color:var(--intake)">0</span></div></div>
      <div class="check"><input type="checkbox" id="lsv" checked>
        <label for="lsv">存进「我的食物」</label></div>
      <div class="err hide" id="lerr"></div>
      <button class="btn gold" onclick="commitLabel()">加入记录</button>
      <div class="note">注意包装上的份量 —— 看着像一份的一袋,标签上常常写的是两三份。</div>`;
  }
  document.getElementById("sheet").innerHTML=`
    <div class="sheet-bg" onclick="if(event.target===this)dismissSheet()">
      <div class="sheet"><div class="sheet-head"><h3>添加餐食</h3>
        <button class="x" style="font-size:26px" onclick="dismissSheet()">×</button></div>
        ${picked?"":`<div class="tabs">
          <button class="tab ${addTab==="search"?"on":""}" onclick="setTab('search')">搜索</button>
          <button class="tab ${addTab==="quick"?"on":""}" onclick="setTab('quick')">快速录入</button>
          <button class="tab ${addTab==="label"?"on":""}" onclick="setTab('label')">营养标签</button></div>`}
        ${inner}</div></div>`;
  if(!picked && addTab==="search") drawList("");
}
function drawList(q){
  q=(q||"").trim().toLowerCase();
  const el=document.getElementById("list"); if(!el) return;
  listRows=[]; let html="";
  if(!q){
    const recent = mine.slice().sort((a,b)=>(b.used||0)-(a.used||0)).slice(0,5);
    if(recent.length){ html+=`<div class="grouphead">最近常吃</div>`;
      recent.forEach(f=>html+=pickBtn({name:f.name,kcal:f.kcal,protein:f.protein},true)); }
  }
  const mn = mine.filter(f=>q && f.name.toLowerCase().includes(q));
  if(mn.length){ html+=`<div class="grouphead">我的食物</div>`;
    mn.forEach(f=>html+=pickBtn({name:f.name,kcal:f.kcal,protein:f.protein},true)); }
  const groups={};
  FOODS.forEach(([g,name,kc,p])=>{
    if(q && !name.toLowerCase().includes(q) && !g.includes(q)) return;
    (groups[g]=groups[g]||[]).push({name,kcal:kc,protein:p}); });
  Object.keys(groups).forEach(g=>{ html+=`<div class="grouphead">${g}</div>`;
    groups[g].forEach(f=>html+=pickBtn(f,false)); });
  if(!html) html=`<div class="empty">没找到。用「快速录入」自己填一条,填完会存起来。</div>`;
  el.innerHTML=html;
}
function pickBtn(f,isMine){
  const i=listRows.push(f)-1, showP=profile&&profile.showProtein;
  return `<button class="pick" onclick="pickIdx(${i})"><div class="body">
    <div class="name">${esc(f.name)}</div>
    ${isMine?`<div class="sub"><span class="tag">已保存</span></div>`
      :showP&&f.protein?`<div class="sub">${f.protein}g 蛋白质</div>`:""}</div>
    <span class="kcal num" style="color:var(--intake)">${f.kcal}</span></button>`;
}
function commit(name,kcal,prot){
  day.food.push({id:uid(),name,kcal:n(kcal),protein:n(prot),ts:Date.now()});
  touchFood(name);
  dismissSheet(); persist();
}
function commitPicked(){ if(picked)
  commit(picked.name,Math.round(picked.kcal*mult),Math.round((picked.protein||0)*mult)); }
function commitQuick(){
  const name=(document.getElementById("qn").value||"").trim();
  const kc=n(document.getElementById("qk").value);
  const pEl=document.getElementById("qp"), pr=pEl?n(pEl.value):0;
  const err=document.getElementById("qerr");
  if(!name||!kc){ err.textContent="名称和热量都要填。"; err.classList.remove("hide"); return; }
  if(document.getElementById("qs").checked) rememberFood(name,kc,pr);
  commit(name,kc,pr);
}
function labelPreview(){
  const kc=n(document.getElementById("lk").value);
  const sv=Number(document.getElementById("ls").value)||0;
  const el=document.getElementById("lprev"); if(el) el.textContent=Math.round(kc*sv).toLocaleString();
}
function commitLabel(){
  const name=(document.getElementById("ln").value||"").trim();
  const kc=n(document.getElementById("lk").value);
  const sv=Number(document.getElementById("ls").value)||0;
  const pEl=document.getElementById("lp"), pr=pEl?n(pEl.value):0;
  const err=document.getElementById("lerr");
  if(!name||!kc||!sv){ err.textContent="名称、每份热量、份数都要填。"; err.classList.remove("hide"); return; }
  if(document.getElementById("lsv").checked) rememberFood(name+"(1份)",kc,pr);
  commit(name,Math.round(kc*sv),Math.round(pr*sv));
}
function copyPrompt(){
  const t="看这张我这一餐的照片,估算每样食物的份量,告诉我总热量"
    +((profile&&profile.showProtein)?"和总蛋白质克数":"")
    +"。请先列出每样食物和它的数值,再给出合计,并说明你假设的份量。";
  if(navigator.clipboard) navigator.clipboard.writeText(t)
    .then(()=>toast("提示词已复制"),()=>say(t,"手动复制"));
  else say(t,"手动复制");
}

/* =====================================================================
   身体数据设置
   ===================================================================== */
let sf={};
function openSetup(){ sf=profile?Object.assign({},profile):{sex:"female",units:"metric"}; drawSetup();
  if(profile) pushNav(()=>closeSetup(true)); }
function setSF(k,v){ sf[k]=v; drawSetup(); }
function readSF(k,v){ sf[k]=v; drawSetupPreview(); }
function sfBmr(){
  const h=sf.units==="metric"?Number(sf.heightCm)||0:(Number(sf.heightIn)||0)*2.54;
  const w=sf.units==="metric"?Number(sf.weightKg)||0:(Number(sf.weightLb)||0)*0.4536;
  const a=Number(sf.age)||0;
  if(!h||!w||!a) return 0;
  const b=10*w+6.25*h-5*a;
  return Math.round(sf.sex==="female"?b-161:b+5);
}
function drawSetupPreview(){
  const el=document.getElementById("bmrPrev"); if(!el) return;
  const v=sfBmr();
  el.innerHTML = v?`<div class="card" style="margin-bottom:16px">
    <div style="font-size:12px;color:var(--muted);margin-bottom:3px">你的基础代谢</div>
    <div class="num" style="font-size:26px;font-weight:600;color:var(--burn)">${v.toLocaleString()}
      <span style="font-size:13px;color:var(--muted)">千卡 / 天</span></div></div>`:"";
}
function drawSetup(){
  const metric=sf.units==="metric";
  document.getElementById("setup").innerHTML=`<div class="setup"><div class="inner">
    <div class="sheet-head"><h3>身体数据</h3>
      ${profile?`<button class="x" style="font-size:26px" onclick="dismissSetup()">×</button>`:""}</div>
    <p class="note" style="margin:0 0 18px">用来算基础代谢 ——
      在你完全不动的情况下,呼吸、思考、维持器官运转所消耗的能量。</p>
    <div class="seg"><button class="${metric?"on":""}" onclick="setSF('units','metric')">公斤 / 厘米</button>
      <button class="${!metric?"on":""}" onclick="setSF('units','imperial')">磅 / 英寸</button></div>
    <div class="seg"><button class="${sf.sex==="female"?"on":""}" onclick="setSF('sex','female')">女</button>
      <button class="${sf.sex==="male"?"on":""}" onclick="setSF('sex','male')">男</button></div>
    <label class="f"><span>年龄</span><input class="in num" type="number" inputmode="numeric"
      placeholder="30" value="${sf.age||""}" oninput="readSF('age',this.value)"></label>
    ${metric
      ? `<label class="f"><span>身高(cm)</span><input class="in num" type="number" inputmode="decimal"
          placeholder="170" value="${sf.heightCm||""}" oninput="readSF('heightCm',this.value)"></label>
         <label class="f"><span>体重(kg)</span><input class="in num" type="number" inputmode="decimal"
          placeholder="65" value="${sf.weightKg||""}" oninput="readSF('weightKg',this.value)"></label>`
      : `<label class="f"><span>身高(英寸)</span><input class="in num" type="number" inputmode="decimal"
          placeholder="67" value="${sf.heightIn||""}" oninput="readSF('heightIn',this.value)"></label>
         <label class="f"><span>体重(磅)</span><input class="in num" type="number" inputmode="decimal"
          placeholder="145" value="${sf.weightLb||""}" oninput="readSF('weightLb',this.value)"></label>`}
    <div id="bmrPrev"></div>
    <button class="btn" onclick="saveSetup()">保存</button>
    <p class="note">用的是 Mifflin-St Jeor 公式。它是人群平均值,只能当作起点 ——
      记录几周之后,「校准」页会用你自己的实测数据取代它。</p>
  </div></div>`;
  drawSetupPreview();
}
function closeSetup(){ document.getElementById("setup").innerHTML=""; }
function dismissSetup(){ goBack() || closeSetup(); }
function saveSetup(){
  if(!sfBmr()){ say("年龄、身高、体重都要填。","还差一点"); return; }
  const metric=sf.units==="metric";
  profile={ sex:sf.sex, units:sf.units, age:Number(sf.age),
    heightCm:Math.round(metric?Number(sf.heightCm):Number(sf.heightIn)*2.54),
    weightKg:Math.round(metric?Number(sf.weightKg):Number(sf.weightLb)*0.4536),
    heightIn:sf.heightIn, weightLb:sf.weightLb,
    showProtein: profile?!!profile.showProtein:false,
    target: profile?profile.target||0:0 };
  save(K.profile,profile);
  if(stack.length) goBack(); else closeSetup();
  render();
}

  const wasToday = daysBetween(curDate,todayKey())===1;
  if(wasToday){ curDate=todayKey(); day=loadDay(curDate); render(); } } },60000);

render();

if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
